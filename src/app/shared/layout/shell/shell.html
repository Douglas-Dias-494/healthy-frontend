<div class="shell">
  <header class="shell__header">
    <div class="shell__bar">
      <a class="shell__brand" [routerLink]="inicio()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"
          />
          <path d="M3.5 12h4l2-3 3 6 2-3h6" />
        </svg>
        Healthy
      </a>

      <nav class="shell__nav" aria-label="Principal">
        @for (item of menu(); track item.caminho) {
          <a class="shell__link" [routerLink]="item.caminho" routerLinkActive="is-active">{{
            item.rotulo
          }}</a>
        }
      </nav>

      <div class="shell__user">
        @if (usuario(); as u) {
          <span class="shell__name">{{ u.nome }}</span>
          <span class="badge">{{ u.perfil === 'MEDICO' ? 'Médico' : 'Paciente' }}</span>
        }
        <button class="btn btn--ghost btn--sm" type="button" (click)="sair()">Sair</button>
      </div>
    </div>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
