name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

      # Falha o CI se alguma dependência de produção tiver vulnerabilidade conhecida de gravidade alta
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
